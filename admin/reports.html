    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary-color: #23138b;
            --secondary-color: #361ed2;
            --accent-color: #6260f4;
            --bg-color: #dce0ff;
            --text-dark: #1b153c;
            --success-color: #28a745;
            --error-color: #dc3545;
        }
    }

    @layer components {
        .btn-primary {
            @apply bg-[var(--primary-color)] text-white px-4 py-2 rounded-lg font-medium hover:bg-opacity-90 transition-all duration-200 flex items-center justify-center gap-2;
        }
        
        .btn-secondary {
            @apply bg-[var(--secondary-color)] text-white px-4 py-2 rounded-lg font-medium hover:bg-opacity-90 transition-all duration-200 flex items-center justify-center gap-2;
        }
        
        .card {
            @apply bg-white rounded-lg shadow-lg p-6;
        }
        
        .table-header {
            @apply bg-gray-50 px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider;
        }
        
        .table-cell {
            @apply px-6 py-4 whitespace-nowrap text-sm text-gray-900;
        }
    }
    </style>
</head>
