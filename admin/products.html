<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyhawk Admin - Manage Products</title>
    
    <!-- React 18 + Tailwind + Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style type="text/tailwindcss">
        @layer components {
            .btn { @apply px-5 py-3 rounded-lg font-medium transition-all; }
            .btn-primary { @apply bg-blue-600 hover:bg-blue-700 text-white; }
            .btn-success { @apply bg-green-600 hover:bg-green-700 text-white; }
            .btn-danger { @apply bg-red-600 hover:bg-red-700 text-white; }
            .input { @apply w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none; }
            .card { @apply bg-white rounded-xl shadow-lg p-6; }
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div id="root"></div>

    <!-- Your Auth.js (adjust path if needed) -->
    <script src="../utils/auth.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function ProductsAdmin() {
            const [products, setProducts] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [showModal, setShowModal] = useState(false);
            const [editId, setEditId] = useState(null);
            const [form, setForm] = useState({
                name: '', code: '', price: '', description: '', image: '', category: 'shortorder', is_available: 1
            });

            const categories = [
                { value: 'shortorder', label: 'Short Order' },
                { value: 'drinks', label: 'Drinks' },
                { value: 'beer', label: 'Beer' },
                { value: 'pork', label: 'Pork' },
                { value: 'coffee', label: 'Coffee' }
            ];

            useEffect(() => {
                // Check login
                if (!AuthService.isAuthenticated()) {
                    alert("Please login first!");
                    window.location.href = "../index.html";
                    return;
                }

                fetch('get_products.php')
                    .then(r => r.json())
                    .then(data => {
                        if (data.success) {
                            setProducts(data.products || []);
                        } else {
                            setError("Failed to load products");
                        }
                    })
                    .catch(err => {
                        console.error(err);
                        setError("Network error: " + err.message);
                    })
                    .finally(() => setLoading(false));
            }, []);

            const saveProduct = async (e) => {
                e.preventDefault();
                const url = editId ? 'update_product.php' : 'add_product.php';
                const body = new FormData(e.target);
                if (editId) body.append('id', editId);

                const res = await fetch(url, { method: 'POST', body });
                const result = await res.json();

                if (result.success) {
                    alert("Product saved!");
                    setShowModal(false);
                    setEditId(null);
                    setForm({ name: '', code: '', price: '', description: '', image: '', category: 'shortorder', is_available: 1 });
                    window.location.reload(); // simple refresh
                } else {
                    alert("Error: " + (result.message || "Unknown"));
                }
            };

            const editProduct = (p) => {
                setEditId(p.id);
                setForm({
                    name: p.name,
                    code: p.code,
                    price: p.price,
                    description: p.description || '',
                    image: p.image || '',
                    category: p.category,
                    is_available: p.is_available
                });
                setShowModal(true);
            };

            const deleteProduct = async (id) => {
                if (!confirm("Delete this product forever?")) return;
                await fetch(`delete_product.php?id=${id}`);
                window.location.reload();
            };

            const toggleStatus = async (id, current) => {
                await fetch('toggle_product.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `id=${id}&available=${current ? 0 : 1}`
                });
                window.location.reload();
            };

            if (loading) return <div className="flex items-center justify-center min-h-screen text-2xl">Loading products...</div>;
            if (error) return <div className="flex items-center justify-center min-h-screen text-red-600 text-xl">{error}</div>;

            return (
                <div className="min-h-screen bg-gray-100">
                    <div className="bg-white shadow p-6 flex justify-between items-center">
                        <h1 className="text-3xl font-bold text-blue-700">Skyhawk Admin - Manage Products</h1>
                        <div className="flex items-center gap-4">
                            <span>Welcome, {AuthService.getAdminInfo()?.fullName || 'Admin'}</span>
                            <button onClick={() => AuthService.logout()} className="btn btn-danger">Logout</button>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto p-8">
                        <button onClick={() => { setEditId(null); setForm({ name: '', code: '', price: '', description: '', image: '', category: 'shortorder', is_available: 1 }); setShowModal(true); }}
                                className="btn btn-primary mb-6 text-lg">
                            + Add New Product
                        </button>

                        <div className="card overflow-x-auto">
                            <table className="min-w-full divide-y divide-gray-200">
                                <thead className="bg-gray-50">
                                    <tr>
                                        <th className="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase">Image</th>
                                        <th className="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase">Name</th>
                                        <th className="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase">Code</th>
                                        <th className="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase">Price</th>
                                        <th className="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase">Category</th>
                                        <th className="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase">Status</th>
                                        <th className="px-6 py-3 text-left text-xs font-bold text-gray-700 uppercase">Actions</th>
                                    </tr>
                                </thead>
                                <tbody className="bg-white divide-y divide-gray-200">
                                    {products.length === 0 ? (
                                        <tr><td colSpan="7" className="text-center py-10 text-gray-500">No products yet. Add one!</td></tr>
                                    ) : (
                                        products.map(p => (
                                            <tr key={p.id} className="hover:bg-gray-50">
                                                <td className="px-6 py-4"><img src={p.image || 'https://via.placeholder.com/60'} alt="" className="w-16 h-16 object-cover rounded" /></td>
                                                <td className="px-6 py-4 font-medium">{p.name}</td>
                                                <td className="px-6 py-4 font-mono text-blue-600">{p.code}</td>
                                                <td className="px-6 py-4 font-bold">₱{parseFloat(p.price).toFixed(2)}</td>
                                                <td className="px-6 py-4 capitalize">{p.category}</td>
                                                <td className="px-6 py-4">
                                                    <span className={`px-3 py-1 rounded-full text-xs ${p.is_available == 1 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                                                        {p.is_available == 1 ? 'Active' : 'Disabled'}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-4 space-x-2">
                                                    <button onClick={() => editProduct(p)} className="btn btn-primary">Edit</button>
                                                    <button onClick={() => toggleStatus(p.id, p.is_available)} className="btn btn-success">
                                                        {p.is_available == 1 ? 'Disable' : 'Enable'}
                                                    </button>
                                                    <button onClick={() => deleteProduct(p.id)} className="btn btn-danger">Delete</button>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>

                        {/* Modal */}
                        {showModal && (
                            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                                <div className="bg-white rounded-2xl p-8 max-w-2xl w-full max-h-screen overflow-y-auto">
                                    <h2 className="text-2xl font-bold mb-6">{editId ? 'Edit' : 'Add'} Product</h2>
                                    <form onSubmit={saveProduct} className="space-y-6">
                                        <input name="name" placeholder="Name" value={form.name} onChange={e => setForm({...form, name: e.target.value})} required className="input" />
                                        <input name="code" placeholder="Code (e.g. R1)" value={form.code} onChange={e => setForm({...form, code: e.target.value.toUpperCase()})} required className="input" />
                                        <input name="price" type="number" step="0.01" placeholder="Price" value={form.price} onChange={e => setForm({...form, price: e.target.value})} required className="input" />
                                        <input name="image" type="url" placeholder="Image URL (optional)" value={form.image} onChange={e => setForm({...form, image: e.target.value})} className="input" />
                                        <textarea name="description" placeholder="Description (optional)" value={form.description} onChange={e => setForm({...form, description: e.target.value})} className="input h-32" />
                                        <select name="category" value={form.category} onChange={e => setForm({...form, category: e.target.value})} className="input">
                                            {categories.map(c => <option key={c.value} value={c.value}>{c.label}</option>)}
                                        </select>
                                        <div className="flex justify-end gap-4">
                                            <button type="button" onClick={() => setShowModal(false)} className="btn bg-gray-500 text-white">Cancel</button>
                                            <button type="submit" className="btn btn-primary">{editId ? 'Update' : 'Add Product'}</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // React 18 correct way
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProductsAdmin />);
    </script>
</body>
</html>
